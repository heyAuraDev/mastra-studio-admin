# Builds the root Dockerfile. Set MASTRA_SERVER_* to bake a server in (see the Dockerfile comments);
# left empty, Studio waits for the admin panel's iframe message.
services:
  studio:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MASTRA_SERVER_HOST: ${MASTRA_SERVER_HOST:-}
        MASTRA_SERVER_PORT: ${MASTRA_SERVER_PORT:-}
        MASTRA_SERVER_PROTOCOL: ${MASTRA_SERVER_PROTOCOL:-}
        MASTRA_API_PREFIX: ${MASTRA_API_PREFIX:-}
        MASTRA_STUDIO_BASE_PATH: ${MASTRA_STUDIO_BASE_PATH:-}
    ports:
      - '8080:80'
